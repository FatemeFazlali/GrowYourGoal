<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#43a047">
<title>GrowGoals</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4f3d8;--card:rgba(255,252,241,.94);--ink:#3b3a2c;--mut:#7a7a5c;--acc:#5f9e5a;--acc2:#d9822b;--line:#e6dcb8;--sky:#bfe4f5;--ground:#8fc46b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a2a3a;--card:rgba(38,52,74,.94);--ink:#f3ecd2;--mut:#b7bf9f;--line:#465873;--sky:#2b3f66;--ground:#3f7a4f}}
:root[data-theme="dark"]{--bg:#1a2a3a;--card:rgba(38,52,74,.94);--ink:#f3ecd2;--mut:#b7bf9f;--line:#465873;--sky:#2b3f66;--ground:#3f7a4f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Quicksand","Nunito",system-ui,sans-serif;font-weight:500;background:linear-gradient(var(--sky),var(--bg) 65%) fixed;min-height:100vh}
.bgk{position:fixed;left:0;right:0;pointer-events:none;z-index:0}
.clouds{top:0;height:150px}.clouds svg{animation:drift 70s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(-26px)}}
.hills{bottom:0;height:20vh;min-height:110px}
#app{max-width:520px;margin:0 auto;padding:14px 14px 90px;position:relative;z-index:1}
h1,h2,h3{margin:0;font-family:"Lora",Georgia,serif}
h1{font-size:22px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:6px;flex-wrap:wrap}
.badge{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:4px 10px;font-weight:700;font-size:13px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(70,90,50,.13)}
.scene{background:radial-gradient(circle at 82% 28%,#fff4bd 0 9%,rgba(255,244,189,.35) 10% 18%,transparent 19%),linear-gradient(var(--sky),var(--sky) 62%,var(--ground) 62%);border-radius:18px;display:flex;justify-content:center;align-items:flex-end;padding:8px 4px 0;min-height:130px;overflow-x:auto;border:2px solid var(--line)}
.bar{height:14px;background:var(--line);border-radius:10px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8cc57a,#f0c25a);border-radius:10px;transition:width .5s}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}
.cd{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc2);font-size:13px}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:10px 14px;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.14)}
button:active{transform:translateY(2px);box-shadow:none}
button.sec{background:var(--line);color:var(--ink)}
button.bad{background:#d98070}
button.sm{padding:6px 10px;font-size:13px}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.55);color:var(--ink);margin:4px 0}
label{font-size:12px;font-weight:700;color:var(--mut)}
.goal{cursor:pointer}
.study{position:fixed;inset:0;background:linear-gradient(var(--sky),var(--bg));z-index:9;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;flex-direction:column}
.flip{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--card);border:3px solid var(--line);border-radius:26px;padding:20px;font-size:22px;font-weight:700;font-family:"Lora",Georgia,serif;margin:14px 0;cursor:pointer;white-space:pre-wrap;box-shadow:0 8px 22px rgba(70,90,50,.16)}
.flip.a{background:#fff6d6;color:#4a3b00;border-color:#e8c25a}
.pill{display:inline-block;background:var(--line);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700}
.pop{animation:pop .5s}@keyframes pop{50%{transform:scale(1.15)}}
.scene{position:relative}
.crit{position:absolute;left:4px;right:4px;bottom:1px;display:flex;justify-content:space-around;align-items:flex-end;pointer-events:none}
.crit span{display:block;width:30px;height:30px}
.crit svg{width:100%;height:100%}
.hop{animation:hop 1.6s ease-in-out infinite}@keyframes hop{50%{transform:translateY(-8px)}}
.fly{position:fixed;left:0;animation:fly linear infinite;will-change:transform}
@keyframes fly{from{transform:translateX(-60px)}to{transform:translateX(calc(100vw + 60px))}}
.bob{animation:bob 2.4s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(26px)}}
.wing{transform-box:fill-box;transform-origin:center;animation:flap .3s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.45)}}
.flap2{transform-origin:center;animation:flap2 .5s ease-in-out infinite alternate}@keyframes flap2{to{transform:scaleY(.5)}}
.ff{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff3a0;box-shadow:0 0 8px 3px rgba(255,240,150,.8);animation:blink 3s ease-in-out infinite alternate}
@keyframes blink{0%{opacity:.1;transform:translate(0,0)}100%{opacity:1;transform:translate(14px,-18px)}}
@media(prefers-reduced-motion:reduce){.fly,.bob,.wing,.flap2,.ff,.hop,.clouds svg{animation:none}}
</style></head><body><div class="bgk clouds"><svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMin slice" width="100%" height="100%"><g fill="#fff" opacity=".85"><ellipse cx="70" cy="40" rx="46" ry="16"/><ellipse cx="102" cy="30" rx="30" ry="16"/><ellipse cx="300" cy="72" rx="50" ry="14"/><ellipse cx="332" cy="60" rx="30" ry="14"/><ellipse cx="190" cy="20" rx="34" ry="10"/></g></svg></div>
<div class="bgk hills"><svg viewBox="0 0 400 120" preserveAspectRatio="none" width="100%" height="100%"><path d="M0 60Q80 8 170 50T400 36V120H0Z" style="fill:var(--ground)" opacity=".5"/><path d="M0 88Q100 42 220 82T400 68V120H0Z" style="fill:var(--ground)" opacity=".85"/></svg></div>
<div id="amb" class="bgk" style="top:0;bottom:0;z-index:2"></div>
<div id="app"></div>
<script>
/* ============================================================
   HARD-CODED SINGLE USER — only this account can enter.
   Change these two lines if you ever want new credentials.
   ============================================================ */
const AUTH_USER = "pretty fatemeh";
const AUTH_PASS = "pretty fatemeh 123456";
/* ============================================================ */

const KEY="growgoals.v1";
const DEF=()=>({big:null,goals:[],xp:0,streak:0,last:"",vis:"forest",seq:true});
let S=DEF(),user=null,view="home",form=null,study=null,authErr="";
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function loadUser(u){user=u;S=DEF();try{const r=ls.get(KEY+"."+u);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}view="home";form=null;study=null}
const save=()=>{if(user)ls.set(KEY+"."+user,JSON.stringify(S))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pct=g=>g.cards.length?Math.round(g.cards.reduce((a,c)=>a+Math.min(c.lvl,3),0)/(3*g.cards.length)*100):0;
const bigPct=()=>S.goals.length?Math.round(S.goals.reduce((a,g)=>a+pct(g),0)/S.goals.length):0;
const isComplete=g=>g.cards.length>0&&pct(g)===100;
function unlockedGoals(){
  if(!S.seq)return S.goals;
  const i=S.goals.findIndex(g=>!isComplete(g));
  return i===-1?S.goals:S.goals.slice(0,i+1);
}
function cd(d){if(!d)return"No deadline";const ms=new Date(d+"T23:59:59")-Date.now();if(ms<0)return"⏰ Time's up";
const s=Math.floor(ms/1000),D=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
return`⏳ ${D}d ${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m ${String(s%60).padStart(2,"0")}s`}
const cdEl=d=>`<span class="cd" data-cd="${d||""}">${cd(d)}</span>`;
function tree(p,w=80){const s=p/100,th=8+30*s,r=6+26*s,cy=100-th-r*.7;
let o=`<svg viewBox="0 0 100 110" width="${w}" height="${w*1.1}"><ellipse cx="50" cy="103" rx="32" ry="5" fill="#7cb342"/>`;
if(p==0)o+=`<ellipse cx="50" cy="99" rx="12" ry="6" fill="#8d6e63"/><path d="M50 96q-3-6 0-10M50 90q6-4 8-1" stroke="#66bb6a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
else{o+=`<rect x="${47-s*3}" y="${100-th}" width="${6+s*6}" height="${th}" rx="3" fill="#7a5a45"/><circle cx="${50-r*.45}" cy="${cy+r*.25}" r="${r*.7}" fill="#5a9a52"/><circle cx="${50+r*.45}" cy="${cy+r*.2}" r="${r*.72}" fill="#4f8f4c"/><circle cx="50" cy="${cy}" r="${r}" fill="${p==100?"#62b257":"#7cbb69"}"/><circle cx="${50-r*.3}" cy="${cy-r*.3}" r="${r*.4}" fill="#b3e094" opacity=".7"/>`;
if(r>14)o+=`<circle cx="${50-r*.35}" cy="${cy-2}" r="2.5" fill="#222"/><circle cx="${50+r*.35}" cy="${cy-2}" r="2.5" fill="#222"/><path d="M45 ${cy+5}q5 5 10 0" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>`;
if(p==100)o+=[[-.5,-.4],[.45,-.1],[-.1,.5]].map(a=>`<circle cx="${50+a[0]*r}" cy="${cy+a[1]*r}" r="4" fill="#e8695f"/>`).join("")+`<circle cx="${50+r+2}" cy="${cy-r*.9}" r="9" fill="#fff3a0" opacity=".3"/><circle cx="${50+r+2}" cy="${cy-r*.9}" r="3" fill="#fff8c4"/><circle cx="${50-r-2}" cy="${cy-r*.2}" r="7" fill="#fff3a0" opacity=".3"/><circle cx="${50-r-2}" cy="${cy-r*.2}" r="2.5" fill="#fff8c4"/>`}
return o+"</svg>"}
function cake(){const n=Math.max(1,Math.min(S.goals.length,5)),H=28,W=150;let o=`<svg viewBox="0 0 200 ${n*H+70}" width="220" height="${(n*H+70)*1.1}"><ellipse cx="100" cy="${n*H+58}" rx="90" ry="8" fill="#cfd8dc"/>`;
for(let i=0;i<n;i++){const g=S.goals[i],p=g?pct(g):0,w=W-i*22,y=n*H+55-(i+1)*H;
o+=`<rect x="${100-w/2}" y="${y}" width="${w}" height="${H}" rx="8" fill="#f6b8b0" opacity="${.25+.75*p/100}" stroke="#b5654f" stroke-width="2"/><path d="M${100-w/2+6} ${y+6}q10 10 20 0t20 0t20 0t20 0" stroke="#fff" stroke-width="3" fill="none" opacity="${.3+.7*p/100}"/>`}
const top=55-H+ (0);const ty=n*H+55-n*H;
o+=`<rect x="98" y="${ty-22}" width="4" height="20" fill="#fdd835"/><path d="M100 ${ty-32}q-5 6 0 9q5-3 0-9" fill="#ff9800"/>`;
if(bigPct()==100)o+=`<circle cx="100" cy="${ty-2}" r="7" fill="#e53935"/>`;
return o+"</svg>"}
function bigVisual(){return S.vis=="cake"?`<div class="scene" style="background:var(--sky);justify-content:center">${cake()}${crit(bigPct())}</div>`:
`<div class="scene">${S.goals.length?S.goals.map(g=>tree(pct(g),Math.min(84,300/S.goals.length))).join(""):tree(0,90)}${crit(bigPct())}</div>`}
function bump(){const t=new Date().toISOString().slice(0,10);if(S.last!=t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last==y?S.streak+1:1;S.last=t}}
const lvl=()=>Math.floor(S.xp/100)+1;
function head(){return`<div class="top"><h1>🌳 GrowGoals</h1><div class="row"><span class="badge">🔥 ${S.streak}</span><span class="badge">⭐ Lv ${lvl()} · ${S.xp%100}/100</span><button class="sec sm" data-a="logout">${esc(user)} ⎋</button></div></div>`}
function home(){let h=head();
if(!S.big)h+=`<div class="card"><h3>Set your big goal 🎯</h3><label>Big goal</label><input id="bt" placeholder="e.g. Master machine learning"><label>Deadline</label><input id="bd" type="date"><button data-a="setbig">Start</button></div>`;
else{const p=bigPct();h+=`<div class="card"><div class="row"><div class="grow"><h2>${esc(S.big.title)}</h2>${cdEl(S.big.deadline)}</div><h2>${p}%</h2></div><div class="bar"><i style="width:${p}%"></i></div>${bigVisual()}
<div class="row" style="margin-top:8px"><button class="sec sm" data-a="vis">${S.vis=="cake"?"🌲 Forest":"🎂 Cake"} view</button><button class="sec sm" data-a="editbig">Edit</button></div></div>
${book(p)}<div class="row" style="margin:6px 0"><h3 class="grow">Sub goals</h3><button class="sec sm" data-a="tseq">${S.seq?"🔒 Sequential":"🔓 All shown"}</button><button class="sm" data-a="newgoal">+ Add</button></div>`;
if(form=="newgoal")h+=`<div class="card"><label>Sub goal</label><input id="gt" placeholder="e.g. Linear algebra"><label>Deadline</label><input id="gd" type="date"><div class="row"><button data-a="addgoal">Save</button><button class="sec" data-a="cancel">Cancel</button></div></div>`;
if(form=="editbig")h+=`<div class="card"><label>Big goal</label><input id="bt" value="${esc(S.big.title)}"><label>Deadline</label><input id="bd" type="date" value="${S.big.deadline||""}"><div class="row"><button data-a="setbig">Save</button><button class="sec" data-a="cancel">Cancel</button></div></div>`;
const vis=unlockedGoals();
h+=vis.map(g=>{const p=pct(g);return`<div class="card goal" data-a="open" data-id="${g.id}"><div class="row"><div>${tree(p,54)}</div><div class="grow"><b>${esc(g.title)}</b><div class="mut">${g.cards.length} cards</div>${cdEl(g.deadline)}<div class="bar"><i style="width:${p}%"></i></div></div><h3>${p}%</h3></div></div>`}).join("")||`<p class="mut">Add your first sub goal to plant a tree 🌱</p>`;
if(S.seq&&vis.length<S.goals.length)h+=`<p class="mut" style="text-align:center">🔒 ${S.goals.length-vis.length} more day(s) unlock as you master the previous one.</p>`}
return h}
function goalView(){const g=S.goals.find(x=>x.id==view);if(!g){view="home";return home()}const p=pct(g);
let h=`<div class="top"><button class="sec sm" data-a="back">← Back</button><span class="badge">${p}%</span></div><div class="card"><h2>${esc(g.title)}</h2>${cdEl(g.deadline)}<div class="bar"><i style="width:${p}%"></i></div><div class="scene" style="justify-content:center">${tree(p,110)}${crit(p)}</div>
<div class="row" style="margin-top:10px"><button class="grow" data-a="study">▶ Study (${g.cards.filter(c=>c.lvl<3).length} due)</button><button class="bad sm" data-a="delgoal">Delete</button></div></div>
<div class="card"><h3>New flash card</h3><label>Concept / question</label><textarea id="cq" rows="2"></textarea><label>Answer</label><textarea id="ca" rows="2"></textarea><button data-a="addcard">Add card</button></div>`;
h+=g.cards.map((c,i)=>`<div class="card row"><div class="grow"><b>${esc(c.q)}</b><div class="mut">${esc(c.a)}</div></div><span class="pill">${"★".repeat(Math.min(c.lvl,3))}${"☆".repeat(3-Math.min(c.lvl,3))}</span><button class="sec sm" data-a="delcard" data-i="${i}">✕</button></div>`).join("");
return h}
function studyView(){const st=study,g=S.goals.find(x=>x.id==view);
if(st.done){
  const idx=S.goals.indexOf(g),next=(S.seq&&idx>=0)?S.goals[idx+1]:null;
  return`<div class="study"><div class="flip pop">🎉 Session complete!<br>+${st.gain} XP</div>
  ${next?`<button data-a="endstudy">Continue: ${esc(next.title)} →</button>`:`<button data-a="endstudy">Back to goal</button>`}</div>`;
}
const c=g.cards[st.q[st.i]];
return`<div class="study"><div class="row"><button class="sec sm" data-a="endstudy">✕</button><div class="grow bar"><i style="width:${st.i/st.q.length*100}%"></i></div><span class="badge">+${st.gain} XP</span></div>
<div class="flip ${st.show?"a":""}" data-a="flip">${st.show?esc(c.a):esc(c.q)}</div>
<div class="mut" style="text-align:center;margin-bottom:8px">${st.show?"How did you do?":"Tap the card to reveal the answer"}</div>
${st.show?`<div class="row"><button class="bad grow" data-a="again">Again</button><button class="grow" data-a="got">Got it ✓</button></div>`:""}</div>`}
function render(){const a=document.getElementById("app");a.innerHTML=(!user?authView():study?studyView():view=="home"?home():goalView())}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;if(["login","logout"].includes(a))return;const v=id=>document.getElementById(id)&&document.getElementById(id).value.trim();
const g=S.goals.find(x=>x.id==view);
if(a=="setbig"){if(!v("bt"))return;S.big={title:v("bt"),deadline:document.getElementById("bd").value};form=null}
else if(a=="editbig")form="editbig";else if(a=="newgoal")form="newgoal";else if(a=="cancel")form=null;
else if(a=="vis")S.vis=S.vis=="cake"?"forest":"cake";
else if(a=="tseq")S.seq=!S.seq;
else if(a=="addgoal"){if(!v("gt"))return;S.goals.push({id:uid(),title:v("gt"),deadline:document.getElementById("gd").value,cards:[]});form=null}
else if(a=="open")view=t.dataset.id;else if(a=="back")view="home";
else if(a=="delgoal"){if(confirm("Delete this sub goal?")){S.goals=S.goals.filter(x=>x.id!=view);view="home"}}
else if(a=="addcard"){if(!v("cq")||!v("ca"))return;g.cards.push({q:v("cq"),a:v("ca"),lvl:0});bump();S.xp+=2}
else if(a=="delcard")g.cards.splice(+t.dataset.i,1);
else if(a=="study"){const q=g.cards.map((c,i)=>i).filter(i=>g.cards[i].lvl<3).sort(()=>Math.random()-.5);if(!q.length){alert(g.cards.length?"All cards mastered! 🌳":"Add some cards first");return}study={q,i:0,show:false,gain:0,done:false}}
else if(a=="flip")study.show=true;
else if(a=="got"||a=="again"){const c=g.cards[study.q[study.i]];if(a=="got"){c.lvl++;study.gain+=10;S.xp+=10}else{c.lvl=Math.max(0,c.lvl-1);study.gain+=1;S.xp+=1}
bump();study.i++;study.show=false;if(study.i>=study.q.length)study.done=true}
else if(a=="endstudy"){
  const cur=S.goals.find(x=>x.id==view);
  const wasDone=study&&study.done;
  study=null;
  if(wasDone&&S.seq&&cur&&isComplete(cur)){
    const idx=S.goals.indexOf(cur);
    if(idx>=0&&S.goals[idx+1])view=S.goals[idx+1].id;
  }
}
save();render()});

/* ---------- locked single-user login screen ---------- */
function authView(){return`<div class="card" style="margin-top:6vh;text-align:center">
<div>${tree(100,90)}</div>
<h1>GrowGoals</h1>
<p class="mut">Private account — sign in to continue</p>
<div style="text-align:left">
  <label>Username</label><input id="au" autocomplete="username" autocapitalize="none">
  <label>Password</label><input id="ap" type="password" autocomplete="current-password">
  <label class="row" style="margin:6px 0"><input id="ak" type="checkbox" checked style="width:auto;margin:0"> Keep me signed in</label>
</div>
${authErr?`<p style="color:#e57373;font-weight:800">${esc(authErr)}</p>`:""}
<button data-a="login" style="width:100%;margin-top:6px">Log in</button>
<p class="mut" style="margin-top:12px">🔒 This app is locked to one account.</p>
</div>`}
function fail(m,u){authErr=m;render();const el=document.getElementById("au");if(el)el.value=u||""}

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
if(a=="logout"){user=null;S=DEF();ls.del("gg.session");try{sessionStorage.removeItem("gg.session")}catch(x){}authErr="";render();return}
if(a!="login")return;
const u=document.getElementById("au").value.trim().replace(/\s+/g," ").toLowerCase();
const p=document.getElementById("ap").value;
if(u!==AUTH_USER||p!==AUTH_PASS)return fail("Wrong username or password",u);
authErr="";
if(document.getElementById("ak").checked)ls.set("gg.session",AUTH_USER);
else{try{sessionStorage.setItem("gg.session",AUTH_USER)}catch(x){}}
loadUser(AUTH_USER);render()});

/* restore session */
{let ss=null;try{ss=sessionStorage.getItem("gg.session")}catch(x){}ss=ss||ls.get("gg.session");
 if(ss===AUTH_USER)loadUser(AUTH_USER)}

const sv=d=>`<svg viewBox="0 0 40 40" width="100%" height="100%">${d}</svg>`;
const CR=[

const book=p=>`<div class="card"><div class="row"><h3 class="grow">Critter book</h3><span class="badge">${CR.filter(c=>p>=c.min).length}/${CR.length}</span></div><div class="row" style="flex-wrap:wrap;justify-content:space-around;gap:8px 0;margin-top:8px">${CR.map(c=>`<div style="text-align:center;width:25%"><div style="width:44px;height:44px;margin:auto;${p>=c.min?"":"filter:grayscale(1) brightness(.5);opacity:.35"}">${sv(c.d)}</div><div class="mut" style="font-size:11px">${p>=c.min?c.n:"at "+c.min+"%"}</div></div>`).join("")}</div></div>`;
function buildAmb(){const cols=["#f5a3c7","#ffd166","#9ad1f5","#c3a6f0"];let h="";
for(let i=0;i<4;i++)h+=`<div class="fly" style="top:${8+i*14}%;animation-duration:${26+i*9}s;animation-delay:-${i*7}s"><div class="bob" style="animation-duration:${2+i*.7}s"><svg viewBox="0 0 30 24" width="26" height="22"><g class="wing"><ellipse cx="9" cy="9" rx="8" ry="7" fill="${cols[i]}"/><ellipse cx="9" cy="17" rx="6" ry="5" fill="${cols[i]}" opacity=".8"/><ellipse cx="21" cy="9" rx="8" ry="7" fill="${cols[i]}"/><ellipse cx="21" cy="17" rx="6" ry="5" fill="${cols[i]}" opacity=".8"/></g><rect x="14" y="5" width="2" height="14" rx="1" fill="#5b4636"/></svg></div></div>`;
for(let i=0;i<3;i++)h+=`<div class="fly" style="top:${4+i*9}%;animation-duration:${40+i*12}s;animation-delay:-${i*15}s"><div class="bob" style="animation-duration:${3+i}s"><svg class="flap2" viewBox="0 0 30 14" width="28" height="13"><path d="M2 10Q8 0 15 8Q22 0 28 10" stroke="#5b6b7a" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div></div>`;
for(let i=0;i<12;i++)h+=`<i class="ff" style="left:${(i*37+11)%96}%;top:${45+(i*23)%50}%;animation-delay:-${i*.7}s;animation-duration:${2.5+i%4}s"></i>`;
document.getElementById("amb").innerHTML=h}
